<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160">
  <style>
    .t { fill: none; stroke: #6b7f95; stroke-opacity: .45; stroke-width: 2; stroke-linejoin: round; }
    .p { fill: none; stroke: #22d3ee; stroke-width: 3; stroke-linecap: round;
         stroke-dasharray: 22 1000; stroke-dashoffset: 22; animation: flow 3.2s linear infinite; }
    .pad { fill: none; stroke: #6b7f95; stroke-opacity: .7; stroke-width: 2; }
    .pin { stroke: #6b7f95; stroke-width: 3; }
    .chip { fill: #0f172a; stroke: #22d3ee; stroke-width: 2; animation: glow 3.2s ease-in-out infinite; }
    .lbl { fill: #e2e8f0; font: 700 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; }
    .d1 { animation-delay: 0s; } .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.6s; } .d4 { animation-delay: 2.4s; }
    @keyframes flow { from { stroke-dashoffset: 22; } to { stroke-dashoffset: -440; } }
    @keyframes glow { 0%,100% { stroke-opacity: .55; } 50% { stroke-opacity: 1; } }
  </style>

  <!-- traces -->
  <g class="t">
    <path id="l1" d="M20 30 H220 L242 52 H350"/>
    <path id="l2" d="M60 64 H350"/>
    <path id="l3" d="M100 110 H210 L244 76 H350"/>
    <path id="l4" d="M20 130 H250 L292 88 H350"/>
    <path id="r1" d="M780 30 H580 L558 52 H450"/>
    <path id="r2" d="M740 64 H450"/>
    <path id="r3" d="M700 110 H590 L556 76 H450"/>
    <path id="r4" d="M780 130 H550 L508 88 H450"/>
  </g>

  <!-- pads -->
  <g class="pad">
    <circle cx="20" cy="30" r="5"/><circle cx="60" cy="64" r="5"/>
    <circle cx="100" cy="110" r="5"/><circle cx="20" cy="130" r="5"/>
    <circle cx="780" cy="30" r="5"/><circle cx="740" cy="64" r="5"/>
    <circle cx="700" cy="110" r="5"/><circle cx="780" cy="130" r="5"/>
  </g>

  <!-- signals -->
  <use href="#l1" class="p d1"/><use href="#l2" class="p d3"/>
  <use href="#l3" class="p d2"/><use href="#l4" class="p d4"/>
  <use href="#r1" class="p d3"/><use href="#r2" class="p d1"/>
  <use href="#r3" class="p d4"/><use href="#r4" class="p d2"/>

  <!-- chip -->
  <g class="pin">
    <path d="M350 52 H360 M350 64 H360 M350 76 H360 M350 88 H360"/>
    <path d="M440 52 H450 M440 64 H450 M440 76 H450 M440 88 H450"/>
    <path d="M380 30 V40 M400 30 V40 M420 30 V40 M380 100 V110 M400 100 V110 M420 100 V110"/>
  </g>
  <rect class="chip" x="360" y="40" width="80" height="60" rx="8"/>
  <text class="lbl" x="400" y="78" text-anchor="middle">AI</text>
</svg>
