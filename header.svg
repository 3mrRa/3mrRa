<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <defs>
    <clipPath id="panel"><rect x="0" y="0" width="800" height="220" rx="16"/></clipPath>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#22d3ee" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <linearGradient id="volt" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset=".35" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset=".65" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#e0f2fe"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-800 0" to="800 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="type"><rect x="150" y="140" width="0" height="40">
      <animate attributeName="width" values="0;500;500;0" keyTimes="0;.45;.9;1" dur="8s" repeatCount="indefinite"/>
    </rect></clipPath>
    <radialGradient id="vig" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#0b1220" stop-opacity=".2"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity=".95"/>
    </radialGradient>
  </defs>
  <style>
    .bits { fill: #22d3ee; fill-opacity: .10; font: 13px ui-monospace, Consolas, Menlo, monospace; letter-spacing: 3px; }
    .r { animation: right linear infinite; } .l { animation: left linear infinite; }
    @keyframes right { from { transform: translateX(-600px); } to { transform: translateX(0); } }
    @keyframes left  { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    .name { font: 800 62px "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; letter-spacing: 3px;
             fill: url(#volt); animation: flicker 6s infinite; }
    @keyframes flicker { 0%,18%,22%,60%,62%,100% { opacity: 1; } 20% { opacity: .4; } 61% { opacity: .7; } }
    .sub { font: 500 20px ui-monospace, Consolas, Menlo, monospace; fill: #cbd5e1; }
    .pr { fill: #22d3ee; }
    .cur { fill: #22d3ee; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <g clip-path="url(#panel)">
    <rect width="800" height="220" fill="#0b1220"/>
    <rect width="800" height="220" fill="url(#grid)"/>
    <text class="bits r" style="animation-duration:18s" x="0" y="24">10100010000110001000010000110010001000011111110000111110010101100111110011001111101100100100111001110111110000000010110011100111110110000100</text>
    <text class="bits l" style="animation-duration:25s" x="0" y="42">10000010001011110011111000111000100101101010001001100111011110000101010110010101101110000001011000000100010101110011100010000010011000010010</text>
    <text class="bits r" style="animation-duration:18s" x="0" y="60">01101110101010111001001001010100110001111011010111011100000110010111011010010100100010101110000010001101101101000010101111001001100001100011</text>
    <text class="bits l" style="animation-duration:25s" x="0" y="78">01010011011110010100110110000100101011000111010010000000101100011010001101000111011000011100101100111111001010110111000001101010111000111101</text>
    <text class="bits r" style="animation-duration:18s" x="0" y="96">11101011100011101101110100100111011010001101100011111111011100000101111000001010110011101110111000101111100011100111000000100000010110001011</text>
    <text class="bits l" style="animation-duration:25s" x="0" y="114">00011110100011000110101101011110010010100101101001100100001000111000100101111100001011001111001011011101010101001001111011110000011111101001</text>
    <text class="bits r" style="animation-duration:18s" x="0" y="132">00111100100100110100100011100011001111111010000010101100010001011010000001011001001100010001110100011010100011111101111010110010100111000001</text>
    <text class="bits l" style="animation-duration:25s" x="0" y="150">01001100001101001101000101000101100000010111110111110001101101100011101000010010000001100011011101101011000101110100110111111011010001111000</text>
    <text class="bits r" style="animation-duration:18s" x="0" y="168">01111001000001101011001100000100011100111000000100000000101010101011101000100011011110000100010110111001010100000000100000000010010000000011</text>
    <text class="bits l" style="animation-duration:25s" x="0" y="186">00001111101110111101010110001010010011010111010010001011011010101110101001101101110011001100011001010000100111100010110011011001100110000111</text>
    <text class="bits r" style="animation-duration:18s" x="0" y="204">10101011110101011001000101010111100101011110001111001101100000100111101101111010110111110101100101000011000011001001010010011001101101010001</text>
    <rect width="800" height="220" fill="url(#vig)"/>
  </g>
  <rect x="1" y="1" width="798" height="218" rx="15" fill="none" stroke="#22d3ee" stroke-opacity=".25"/>
  <text class="name" x="400" y="112" text-anchor="middle" filter="url(#glow)">OMAR RABIEH</text>
  <g clip-path="url(#type)">
    <text class="sub" x="400" y="166" text-anchor="middle"><tspan class="pr">&gt;</tspan> Computer Engineering @ Birzeit University<tspan class="cur">_</tspan></text>
  </g>
</svg>
